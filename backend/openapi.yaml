components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          description: Operation result
          example: true
        message:
          type: string
          description: Human-readable message
          example: Operation successful
        data:
          description: Response payload
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code identifier
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error description
              example: Invalid input fields
            details:
              type: object
              description: Additional error context (field-level errors etc.)

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Items per page
          example: 20
        total:
          type: integer
          description: Total number of items
          example: 150
        total_pages:
          type: integer
          description: Total number of pages
          example: 8

security:
  - BearerAuth: []
