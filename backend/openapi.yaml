openapi: "3.1.0"
info:
  title: YakinLulus.id API
  version: "1.0.0"
  description: |
    Computer-Based Testing (CBT) platform API for YakinLulus.id.
    Authentication via Bearer JWT. All authenticated routes use
    the `Authorization: Bearer <token>` header.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  # ──────────────────────────────────────────
  # Auth Module (15 endpoints)
  # ──────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      summary: Register new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                phone: { type: string }
              required: [email, password, name]
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with email + password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        "200":
          description: Login success, returns JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
              required: [token, password]
      responses:
        "200":
          description: Password reset success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user profile
      tags: [Auth]
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/profile:
    put:
      operationId: updateProfile
      summary: Update current user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                avatar_url: { type: string, format: uri }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate current session
      tags: [Auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh JWT token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/users:
    get:
      operationId: listUsers
      summary: List all users (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: role
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createUser
      summary: Create user (admin/staff)
      tags: [Auth Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role: { type: string }
              required: [email, password, name, role]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/users/search:
    get:
      operationId: searchUsers
      summary: Search users (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - $ref: "#/components/schemas/PaginationMeta"

  /auth/users/{id}:
    get:
      operationId: getUser
      summary: Get user by ID (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateUser
      summary: Update user (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string }
                is_active: { type: boolean }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteUser
      summary: Delete user (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /auth/users/{id}/activate:
    patch:
      operationId: activateUser
      summary: Activate/deactivate user (admin/staff)
      tags: [Auth Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean }
              required: [is_active]
      responses:
        "200":
          description: User activation status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  # ──────────────────────────────────────────
  # Academic Module (16 endpoints)
  # ──────────────────────────────────────────
  /academic/levels:
    get:
      operationId: listLevels
      summary: List education levels
      tags: [Academic]
      responses:
        "200":
          description: List of levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    post:
      operationId: createLevel
      summary: Create education level (admin/staff)
      tags: [Academic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
              required: [name, code]
      responses:
        "201":
          description: Level created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/levels/{id}:
    get:
      operationId: getLevel
      summary: Get education level by ID
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Level data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateLevel
      summary: Update education level (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Level updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteLevel
      summary: Delete education level (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Level deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/subjects:
    get:
      operationId: listSubjects
      summary: List subjects
      tags: [Academic]
      parameters:
        - name: level_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    post:
      operationId: createSubject
      summary: Create subject (admin/staff)
      tags: [Academic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                level_id: { type: string }
                description: { type: string }
              required: [name, code, level_id]
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/subjects/{id}:
    get:
      operationId: getSubject
      summary: Get subject by ID
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subject data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateSubject
      summary: Update subject (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Subject updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteSubject
      summary: Delete subject (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subject deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/subjects/{id}/chapters:
    get:
      operationId: listSubjectChapters
      summary: List chapters for a subject
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/chapters/{id}:
    get:
      operationId: getChapter
      summary: Get chapter by ID
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chapter data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateChapter
      summary: Update chapter (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                order: { type: integer }
      responses:
        "200":
          description: Chapter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteChapter
      summary: Delete chapter (admin/staff)
      tags: [Academic]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chapter deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/chapters:
    post:
      operationId: createChapter
      summary: Create chapter (admin/staff)
      tags: [Academic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id: { type: string }
                name: { type: string }
                description: { type: string }
                order: { type: integer }
              required: [subject_id, name]
      responses:
        "201":
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /academic/curriculums:
    get:
      operationId: listCurriculums
      summary: List curriculums
      tags: [Academic]
      responses:
        "200":
          description: List of curriculums
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  # ──────────────────────────────────────────
  # Question Bank Module (10 endpoints)
  # ──────────────────────────────────────────
  /questions:
    get:
      operationId: listQuestions
      summary: List questions with filters
      tags: [Question Bank]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: level_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated question list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createQuestion
      summary: Create a question (admin/staff/teacher)
      tags: [Question Bank]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id: { type: string }
                chapter_id: { type: string }
                type: { type: string }
                difficulty: { type: string }
                stem: { type: string }
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string }
                      text: { type: string }
                      is_correct: { type: boolean }
                explanation: { type: string }
                points: { type: integer }
              required: [subject_id, type, stem]
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /questions/{id}:
    get:
      operationId: getQuestion
      summary: Get question by ID
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Question data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateQuestion
      summary: Update question (admin/staff/teacher)
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stem: { type: string }
                type: { type: string }
                difficulty: { type: string }
                explanation: { type: string }
                points: { type: integer }
      responses:
        "200":
          description: Question updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteQuestion
      summary: Delete question (admin/staff/teacher)
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Question deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /questions/{id}/options:
    get:
      operationId: getQuestionOptions
      summary: Get options for a question
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateQuestionOptions
      summary: Bulk replace options (admin/staff/teacher)
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  text: { type: string }
                  is_correct: { type: boolean }
                required: [label, text, is_correct]
      responses:
        "200":
          description: Options updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /questions/{id}/publish:
    patch:
      operationId: publishQuestion
      summary: Publish/unpublish question (admin/staff/teacher)
      tags: [Question Bank]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                published: { type: boolean }
              required: [published]
      responses:
        "200":
          description: Publish status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /questions/import:
    post:
      operationId: importQuestions
      summary: Bulk import questions (admin/staff/teacher)
      tags: [Question Bank]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                subject_id: { type: string }
              required: [file, subject_id]
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /questions/export:
    get:
      operationId: exportQuestions
      summary: Export questions as file (admin/staff/teacher)
      tags: [Question Bank]
      parameters:
        - name: subject_id
          in: query
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx] }
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ──────────────────────────────────────────
  # CBT Engine - Exams (24 endpoints)
  # ──────────────────────────────────────────
  /exams:
    get:
      operationId: listExams
      summary: List exams with filters
      tags: [CBT Engine]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated exam list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createExam
      summary: Create exam (admin/staff/teacher)
      tags: [CBT Engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                subject_id: { type: string }
                level_id: { type: string }
                description: { type: string }
                duration_minutes: { type: integer }
                total_questions: { type: integer }
                passing_score: { type: integer }
              required: [title, subject_id]
      responses:
        "201":
          description: Exam created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /exams/{id}:
    get:
      operationId: getExam
      summary: Get exam by ID
      tags: [CBT Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exam data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    put:
      operationId: updateExam
      summary: Update exam (admin/staff/teacher)
      tags: [CBT Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                duration_minutes: { type: integer }
                passing_score: { type: integer }
      responses:
        "200":
          description: Exam updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    delete:
      operationId: deleteExam
      summary: Delete exam (admin/staff/teacher)
      tags: [CBT Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exam deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /exams/{id}/analytics:
    get:
      operationId: getExamAnalytics
      summary: Get analytics for an exam
      tags: [CBT Engine]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exam analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /exams/{id}/publish:
    post:
      operationId: publishExam
      summary: Publish exam (admin/staff/teacher)
      tags: [CBT Engine]
      parameters:
        - name: id
